# Traefik Ingress (bundled with k3s). TLS for users is at Cloudflare.
# Inside the cluster we speak HTTP on the pod network — no origin cert.
#
# HelmChartConfig is k3s-native. We force Traefik to ClusterIP and turn
# off hostNetwork / published 80/443. Otherwise Traefik binds 0.0.0.0:80
# and the "zero public inbound" story dies at the first kubectl apply.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge-echo
  namespace: edge
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge-echo
                port:
                  number: 8080
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        expose:
          default: false
        exposedPort: 80
      websecure:
        expose:
          default: false
        exposedPort: 443
    service:
      enabled: true
      type: ClusterIP
    hostNetwork: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 128Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
    additionalArguments:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
