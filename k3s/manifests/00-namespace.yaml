# Application namespace. Isolation starts here: NetworkPolicy in 10- is
# default-deny, so a forgotten Pod is not reachable from the rest of the
# cluster even if someone labels it wrong.
apiVersion: v1
kind: Namespace
metadata:
  name: edge
  labels:
    app.kubernetes.io/part-of: edge-zero
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare-tunnel
  labels:
    app.kubernetes.io/part-of: edge-zero
    # cloudflared needs to bind hostPath for nothing, but it does talk
    # to the public internet — PSA baseline, not restricted.
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: edge-zero
    pod-security.kubernetes.io/enforce: baseline
