# Remote deploy over Tailscale. Manual only, plus GitHub Environment
# protection on staging/production.
#
# Build uses GITHUB_TOKEN (always present). The Tailscale steps run
# only when OAuth secrets and NODE_TAILSCALE_IP are set — a dispatch
# without them stays green and prints why it skipped.
#
# Per-environment (Settings → Environments → staging | production):
#   secrets: TAILSCALE_OAUTH_CLIENT_ID, TAILSCALE_OAUTH_CLIENT_SECRET
#   vars:    NODE_TAILSCALE_IP, NODE_SSH_USER
#
# ACL: tag:ci → tag:node:22  (cloudflare/tailscale-acl.hujson)

name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      ref:
        description: "git ref to build and deploy"
        required: false
        default: "main"
      skip_build:
        description: "Skip Buildx and reuse the existing GHCR tag for this SHA"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      can_deploy: ${{ steps.gate.outputs.can_deploy }}
      do_build: ${{ steps.gate.outputs.do_build }}
    steps:
      - id: gate
        env:
          TS_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          NODE: ${{ vars.NODE_TAILSCALE_IP }}
          SKIP_BUILD: ${{ github.event.inputs.skip_build }}
        run: |
          set -euo pipefail
          do_build=true
          [[ "${SKIP_BUILD}" == "true" ]] && do_build=false
          echo "do_build=${do_build}" >> "$GITHUB_OUTPUT"

          if [[ -n "${TS_ID}" && -n "${TS_SECRET}" && -n "${NODE}" ]]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Tailscale secrets and NODE_TAILSCALE_IP are set."
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping remote deploy: set TAILSCALE_OAUTH_CLIENT_ID/SECRET and NODE_TAILSCALE_IP on the ${{ github.event.inputs.environment }} environment."
          fi

  build:
    needs: [preflight]
    if: needs.preflight.outputs.do_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      remote: ${{ steps.meta.outputs.remote }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "remote=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/app
          target: runtime
          push: false
          load: true
          tags: edge-echo:ci
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              --scanners vuln \
              edge-echo:ci

      - name: push
        continue-on-error: true
        env:
          REMOTE: ${{ steps.meta.outputs.remote }}
          TARGET_ENV: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          docker tag edge-echo:ci "${REMOTE}:${GITHUB_SHA}"
          docker tag edge-echo:ci "${REMOTE}:${TARGET_ENV}"
          docker push "${REMOTE}:${GITHUB_SHA}" || echo "::warning::GHCR push of :${GITHUB_SHA} skipped"
          docker push "${REMOTE}:${TARGET_ENV}" || echo "::warning::GHCR push of :${TARGET_ENV} skipped"

  deploy:
    needs: [preflight, build]
    if: ${{ always() && needs.preflight.outputs.can_deploy == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment }}
    env:
      NODE: ${{ vars.NODE_TAILSCALE_IP }}
      USER: ${{ vars.NODE_SSH_USER || 'ubuntu' }}
      TARGET_ENV: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: resolve image
        id: image
        run: |
          set -euo pipefail
          REMOTE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "ref=${REMOTE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          args: --ssh --timeout=30s

      - name: wait for node
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            if tailscale ping --c 1 --timeout 3s "${NODE}"; then
              exit 0
            fi
            sleep 2
          done
          echo "node ${NODE} is not reachable over Tailscale" >&2
          tailscale status
          exit 1

      - name: snapshot current image
        id: prev
        run: |
          set -euo pipefail
          PREV="$(ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${USER}@${NODE}" \
            "sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n edge get deploy edge-echo -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true")"
          echo "image=${PREV}" >> "$GITHUB_OUTPUT"
          echo "previous image: ${PREV:-none}"

      - name: apply and health-check
        id: apply
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          PREV: ${{ steps.prev.outputs.image }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "${USER}@${NODE}" "sudo mkdir -p /opt/edge && sudo chown ${USER}:${USER} /opt/edge"
          tar czf /tmp/edge.tgz k3s monitoring scripts cloudflare
          scp -o StrictHostKeyChecking=accept-new /tmp/edge.tgz "${USER}@${NODE}:/opt/edge/edge.tgz"

          ssh -o BatchMode=yes "${USER}@${NODE}" \
            "IMAGE=$(printf %q "${IMAGE}") PREV=$(printf %q "${PREV}") TARGET_ENV=$(printf %q "${TARGET_ENV}") bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/edge
          tar xzf edge.tgz
          sudo sed -i "s|image: ghcr.io/.*/edge-echo:.*|image: ${IMAGE}|" k3s/manifests/20-deployment.yaml
          sudo sed -i "s|image: ghcr.io/.*/zero-trust-edge:.*|image: ${IMAGE}|" k3s/manifests/20-deployment.yaml

          KCTL="sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl"
          if ! command -v kubectl >/dev/null || ! sudo test -f /etc/rancher/k3s/k3s.yaml; then
            echo "k3s not installed; files dropped at /opt/edge"
            exit 20
          fi

          ${KCTL} apply -f k3s/manifests/
          ${KCTL} -n edge annotate deploy/edge-echo \
            environment="${TARGET_ENV}" \
            --overwrite

          if ! ${KCTL} -n edge rollout status deploy/edge-echo --timeout=120s; then
            echo "ROLLING_BACK rollout status failed"
            exit 30
          fi

          probe() {
            local name="$1" script="$2"
            ${KCTL} -n edge delete pod "${name}" --ignore-not-found --wait=false >/dev/null 2>&1 || true
            ${KCTL} -n edge run "${name}" --restart=Never --image=alpine:3.21 --command -- \
              /bin/sh -c "${script}"
            ${KCTL} -n edge wait --for=jsonpath='{.status.phase}'=Succeeded pod/"${name}" --timeout=30s
            ${KCTL} -n edge logs "${name}"
            ${KCTL} -n edge delete pod "${name}" --wait=false >/dev/null 2>&1 || true
          }

          if ! probe "healthz-ci" "wget -qO- --timeout=5 http://edge-echo.edge.svc:8080/healthz | grep -q ok"; then
            echo "ROLLING_BACK healthz failed"
            exit 31
          fi

          if ! probe "readyz-ci" "dd if=/dev/zero bs=8192 count=1 of=/tmp/p 2>/dev/null; wget -qO- --timeout=8 --post-file=/tmp/p http://edge-echo.edge.svc:8080/readyz | grep -q ready"; then
            echo "ROLLING_BACK large POST /readyz failed (MTU?)"
            exit 32
          fi

          echo "health-check passed env=${TARGET_ENV} image=${IMAGE}"
          REMOTE

      - name: rollback
        if: failure() && steps.apply.outcome == 'failure' && steps.prev.outputs.image != ''
        env:
          PREV: ${{ steps.prev.outputs.image }}
        run: |
          set -euo pipefail
          echo "rolling back to ${PREV}"
          ssh -o BatchMode=yes "${USER}@${NODE}" \
            "PREV=$(printf %q "${PREV}") bash -s" <<'REMOTE'
          set -euo pipefail
          KCTL="sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl"
          ${KCTL} -n edge rollout undo deploy/edge-echo || \
            ${KCTL} -n edge set image deploy/edge-echo edge-echo="${PREV}"
          ${KCTL} -n edge rollout status deploy/edge-echo --timeout=120s
          ${KCTL} -n edge get deploy,rs,pods -o wide
          REMOTE
          echo "rollback to ${PREV} complete"
          exit 1

      - name: zero-trust verify
        if: success()
        run: |
          ssh -o BatchMode=yes "${USER}@${NODE}" "sudo /opt/edge/scripts/zero-trust-verify.sh"

      - name: logout of tailnet
        if: always()
        continue-on-error: true
        run: sudo tailscale logout || true
