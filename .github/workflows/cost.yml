# Weekly idle-resource hunt. Skips cleanly when AWS OIDC is not configured.
name: cost-snapshot

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  snapshot:
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: snapshot
        run: ./scripts/cost-snapshot.sh

  skip:
    if: ${{ vars.AWS_ROLE_ARN == '' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "AWS_ROLE_ARN is not set; cost snapshot skipped. Workflow stays green."
