# Build, lint, scan. No deploy, no secrets required besides GHCR push
# on the default branch.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/edge-echo
  GO_VERSION: "1.22"

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive terraform
      - name: init (no backend) + validate
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

  go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docker/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: docker/app/go.sum
      - run: go vet ./...
      - run: go test ./...

  image:
    runs-on: ubuntu-24.04
    needs: [go]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/app
          target: runtime
          # Load locally so Trivy can scan without pulling a private GHCR package.
          # Push is a separate step after the scan passes.
          push: false
          load: true
          tags: |
            edge-echo:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Run Trivy from its own image. The composite action's install.sh
      # (trivy-action@v0.32.0 → setup-trivy v0.64.1) exits 1 on GHA.
      - name: trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              --scanners vuln \
              edge-echo:ci
      - name: push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker tag edge-echo:ci "${IMAGE}:${GITHUB_SHA}"
          docker tag edge-echo:ci "${IMAGE}:dev"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:dev"

  yaml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: -strict -ignore-missing-schemas -summary k3s/manifests
