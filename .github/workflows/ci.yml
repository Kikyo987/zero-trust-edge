# Push / PR: build the image and run Trivy. No deploy, no extra secrets.
# GHCR push is best-effort. A denied push must not fail the job — the
# scan already ran against the local image.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.2"

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive terraform
      - name: init (no backend) + validate
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

  go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docker/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: docker/app/go.sum
      - run: go vet ./...
      - run: go test ./...

  yaml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: -strict -ignore-missing-schemas -summary k3s/manifests

  image:
    runs-on: ubuntu-24.04
    needs: [go]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: image name
        id: name
        run: |
          # GITHUB_TOKEN may only push packages named after this repository.
          echo "local=edge-echo:ci" >> "$GITHUB_OUTPUT"
          echo "remote=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/app
          target: runtime
          push: false
          load: true
          tags: edge-echo:ci
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              --scanners vuln \
              edge-echo:ci

      - name: push
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          REMOTE: ${{ steps.name.outputs.remote }}
        run: |
          set -euo pipefail
          docker tag edge-echo:ci "${REMOTE}:${GITHUB_SHA}"
          docker tag edge-echo:ci "${REMOTE}:dev"
          if docker push "${REMOTE}:${GITHUB_SHA}" && docker push "${REMOTE}:dev"; then
            echo "pushed ${REMOTE}:${GITHUB_SHA}"
          else
            echo "::warning::GHCR push denied or unavailable. Trivy already passed on the local image."
            exit 0
          fi
