# Prometheus scrape + Alertmanager. Bind Prometheus itself to the
# compose network; the host publish is 127.0.0.1:9090.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: edge-zero
    env: dev

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Drop high-cardinality per-CPU labels we do not graph.
      - source_labels: [__name__]
        regex: 'container_cpu_cfs_.*|container_network_.*_errors_total'
        action: drop

  - job_name: edge-echo
    metrics_path: /metrics
    static_configs:
      - targets: ["edge-echo:8080"]

  - job_name: edge-echo-readyz
    metrics_path: /readyz
    scrape_interval: 30s
    static_configs:
      - targets: ["edge-echo:8080"]

  - job_name: cloudflared
    metrics_path: /metrics
    static_configs:
      - targets: ["cloudflared:2000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
