groups:
  - name: edge-zero
    rules:
      - alert: InstanceDown
        expr: up{job="edge-echo"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "edge-echo is not scraping"
          description: "The origin behind the tunnel is gone. Users will 1033/502."

      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "node-exporter is down — host metrics are blind"

      - alert: CadvisorDown
        expr: up{job="cadvisor"} == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "cAdvisor is down — container metrics are blind"

      - alert: HighErrorRate
        expr: |
          sum(rate(edge_echo_requests_total{code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(edge_echo_requests_total[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "5xx rate > 5% over 10m"

      - alert: HostCPUHigh
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "host CPU > 85% for 15m (k3s + Loki fighting for a 2 GB box?)"

      - alert: HostMemLow
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "available memory < 10%"

      - alert: DiskFilling
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) < 0.15
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "filesystem < 15% free (Loki chunks / containerd?)"

      - alert: ContainerOOM
        expr: increase(container_oom_events_total[15m]) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "a container OOM-killed in the last 15m"
          description: "{{ $labels.name }} on {{ $labels.instance }}"

      - alert: PMTUDBroken
        expr: probe_icmp_df_ok{size="1472"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Path MTU discovery failed at 1472 bytes"
          description: "GET will work, POST will hang. See docs/postmortem-example.md."

      - alert: CloudflareOriginTimeouts
        expr: increase(cloudflared_tunnel_request_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "cloudflared is seeing origin errors"

      - alert: NatGatewayPresent
        expr: aws_nat_gateway_count > 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "A NAT Gateway exists. Confirm this was a conscious FinOps choice."
