<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">Dual-plane zero-trust edge</title>
  <desc id="desc">User traffic goes Internet, Cloudflare Access, cloudflared, Kubernetes Service, app. Operator traffic goes Tailscale ACL to the node. The tunnel does not traverse Tailscale.</desc>
  <rect width="1120" height="760" fill="#f4f6f8"/>
  <text x="36" y="42" font-family="system-ui, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1a202c">Dual-plane edge</text>
  <text x="36" y="66" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#4a5568">User packets and operator packets share a node. They do not share a path.</text>

  <rect x="24" y="88" width="1072" height="280" rx="12" fill="#e7f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="44" y="116" font-family="system-ui, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1a365d">User plane — Cloudflare Tunnel</text>
  <text x="44" y="136" font-family="system-ui, Segoe UI, sans-serif" font-size="12" fill="#2a4365">Outbound connector. No public inbound port. Not a hop through Tailscale.</text>

  <g font-family="system-ui, Segoe UI, sans-serif" font-size="13" fill="#1a202c">
    <rect x="44" y="168" width="150" height="78" rx="8" fill="#ffffff" stroke="#2b6cb0"/>
    <text x="119" y="198" text-anchor="middle" font-weight="650">Internet users</text>
    <text x="119" y="218" text-anchor="middle" font-size="11" fill="#4a5568">HTTPS SNI</text>

    <rect x="250" y="160" width="170" height="94" rx="8" fill="#ffffff" stroke="#2b6cb0"/>
    <text x="335" y="190" text-anchor="middle" font-weight="650">Cloudflare</text>
    <text x="335" y="210" text-anchor="middle" font-size="11" fill="#4a5568">Access + MFA</text>
    <text x="335" y="228" text-anchor="middle" font-size="11" fill="#4a5568">WAF · TLS 1.3</text>

    <rect x="476" y="160" width="180" height="94" rx="8" fill="#ffffff" stroke="#2b6cb0"/>
    <text x="566" y="190" text-anchor="middle" font-weight="650">cloudflared</text>
    <text x="566" y="210" text-anchor="middle" font-size="11" fill="#4a5568">dials out :443</text>
    <text x="566" y="228" text-anchor="middle" font-size="11" fill="#4a5568">QUIC or HTTP/2</text>

    <rect x="712" y="160" width="200" height="94" rx="8" fill="#ffffff" stroke="#2b6cb0"/>
    <text x="812" y="188" text-anchor="middle" font-weight="650">Service network</text>
    <text x="812" y="208" text-anchor="middle" font-size="11" fill="#4a5568">edge-echo.edge.svc:8080</text>
    <text x="812" y="226" text-anchor="middle" font-size="11" fill="#4a5568">ClusterIP 10.44.0.0/16</text>

    <rect x="968" y="168" width="104" height="78" rx="8" fill="#ffffff" stroke="#2b6cb0"/>
    <text x="1020" y="198" text-anchor="middle" font-weight="650">edge-echo</text>
    <text x="1020" y="218" text-anchor="middle" font-size="11" fill="#4a5568">UID 65532</text>
  </g>

  <g stroke="#2b6cb0" stroke-width="1.6" fill="#2b6cb0">
    <line x1="194" y1="207" x2="246" y2="207"/>
    <polygon points="246,202 256,207 246,212"/>
    <line x1="420" y1="207" x2="472" y2="207"/>
    <polygon points="472,202 482,207 472,212"/>
    <line x1="656" y1="207" x2="708" y2="207"/>
    <polygon points="708,202 718,207 708,212"/>
    <line x1="912" y1="207" x2="964" y2="207"/>
    <polygon points="964,202 974,207 964,212"/>
  </g>

  <text x="44" y="292" font-family="system-ui, Segoe UI, sans-serif" font-size="12" fill="#2a4365">Origin in cloudflare/config.yml: http://edge-echo.edge.svc.cluster.local:8080</text>
  <text x="44" y="312" font-family="system-ui, Segoe UI, sans-serif" font-size="12" fill="#2a4365">Compose origin: http://edge-echo:8080 on the bridge 10.45.0.0/24. DNS is a CNAME to *.cfargotunnel.com.</text>
  <text x="44" y="344" font-family="system-ui, Segoe UI, sans-serif" font-size="12" fill="#2a4365">Pod CIDR 10.43.0.0/16 stays on the node. It is not advertised into the tailnet.</text>

  <rect x="24" y="408" width="1072" height="250" rx="12" fill="#e5f6ec" stroke="#2f855a" stroke-width="1.5"/>
  <text x="44" y="436" font-family="system-ui, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1c4532">Operator plane — Tailscale</text>
  <text x="44" y="456" font-family="system-ui, Segoe UI, sans-serif" font-size="12" fill="#276749">Identity ACL on 100.64.0.0/10. Separate from the tunnel. sshd listens on 100.x only.</text>

  <g font-family="system-ui, Segoe UI, sans-serif" font-size="13" fill="#1a202c">
    <rect x="44" y="484" width="170" height="88" rx="8" fill="#ffffff" stroke="#2f855a"/>
    <text x="129" y="516" text-anchor="middle" font-weight="650">group:ops</text>
    <text x="129" y="536" text-anchor="middle" font-size="11" fill="#4a5568">SSH, kubectl</text>
    <text x="129" y="554" text-anchor="middle" font-size="11" fill="#4a5568">Grafana, Prometheus</text>

    <rect x="250" y="484" width="150" height="88" rx="8" fill="#ffffff" stroke="#2f855a"/>
    <text x="325" y="516" text-anchor="middle" font-weight="650">tag:ci</text>
    <text x="325" y="536" text-anchor="middle" font-size="11" fill="#4a5568">SSH :22 only</text>
    <text x="325" y="554" text-anchor="middle" font-size="11" fill="#4a5568">Grafana denied</text>

    <rect x="456" y="484" width="190" height="88" rx="8" fill="#ffffff" stroke="#2f855a"/>
    <text x="551" y="516" text-anchor="middle" font-weight="650">Tailscale ACL</text>
    <text x="551" y="536" text-anchor="middle" font-size="11" fill="#4a5568">tailscale/acl.hujson</text>
    <text x="551" y="554" text-anchor="middle" font-size="11" fill="#4a5568">100.64.0.0/10</text>

    <rect x="702" y="476" width="360" height="104" rx="8" fill="#ffffff" stroke="#2f855a"/>
    <text x="882" y="506" text-anchor="middle" font-weight="650">node</text>
    <text x="882" y="528" text-anchor="middle" font-size="12" fill="#4a5568">:22 sshd on 100.x · :6443 kube-apiserver</text>
    <text x="882" y="548" text-anchor="middle" font-size="12" fill="#4a5568">:3000 :9090 :3100 for group:ops only</text>
    <text x="882" y="566" text-anchor="middle" font-size="11" fill="#4a5568">VPC 10.42.0.0/16 has no public TCP ingress</text>
  </g>

  <g stroke="#2f855a" stroke-width="1.6" fill="#2f855a">
    <line x1="214" y1="528" x2="246" y2="528"/>
    <polygon points="246,523 256,528 246,533"/>
    <line x1="400" y1="528" x2="452" y2="528"/>
    <polygon points="452,523 462,528 452,533"/>
    <line x1="646" y1="528" x2="698" y2="528"/>
    <polygon points="698,523 708,528 698,533"/>
  </g>

  <text x="44" y="604" font-family="system-ui, Segoe UI, sans-serif" font-size="12" fill="#276749">A regular user is not in group:ops and is not tag:ci. The ACL does not grant them :22.</text>
  <text x="44" y="624" font-family="system-ui, Segoe UI, sans-serif" font-size="12" fill="#276749">CI is tag:ci. The only grant to tag:node is tcp/22. Grafana is not on that grant.</text>

  <rect x="24" y="676" width="1072" height="60" rx="8" fill="#fffaf0" stroke="#c05621"/>
  <text x="44" y="702" font-family="system-ui, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#7b341e">The tunnel does not enter Tailscale.</text>
  <text x="44" y="722" font-family="system-ui, Segoe UI, sans-serif" font-size="12" fill="#7b341e">cloudflared is a pod (or a compose service) that connects to the app over the cluster Service network. tailscale0 is the operator NIC.</text>
</svg>
